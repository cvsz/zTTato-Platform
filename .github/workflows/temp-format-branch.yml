name: Temporary branch-only Ruff formatter
on:
  push:
    branches: [upgrade/production-readiness-v2]
    paths:
      - .github/workflows/temp-format-branch.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'cvsz/zTTato-Platform' && github.ref == 'refs/heads/upgrade/production-readiness-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply Ruff formatting on this feature branch only
        run: |
          python -m pip install ruff==0.16.8
          ruff format app tests
          if ! git diff --quiet -- app tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app tests
            git commit -m "style: apply Ruff formatting to application and tests"
            git push origin HEAD:refs/heads/upgrade/production-readiness-v2
          fi

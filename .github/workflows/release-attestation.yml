name: Release Attestation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Release supply-chain guidance
        run: |
          echo "This template is intentionally artifact-agnostic."
          echo "Add the repository's deterministic build step, generate an SBOM, then attest the exact released artifact digest."
          echo "Do not attest placeholder or unverified artifacts."
